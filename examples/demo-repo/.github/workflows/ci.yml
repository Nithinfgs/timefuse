name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - uses: actions/upload-artifact@v3
        with:
          name: report
          path: report/
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
  legacy:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/cache@v2
        with:
          path: ~/.cache
          key: demo
